<!doctype html><html><head><meta charset="utf-8"><title>Rendering diagnosis harness</title>

<style>html,body{margin:0;height:100%;background:#0c1017}canvas{width:100%;height:100%;display:block}</style></head><body><canvas></canvas><script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {integrateScene} from '/src/features/world/SceneIntegrator';
import {RuntimeMaterialQuality} from '/src/features/world/RuntimeMaterialQuality';
import {RigidWorldBatch} from '/src/features/world/RigidWorldBatch';
import {configureProductionLighting} from '/src/features/world/ProductionLighting';
import {CameraDirector} from '/src/features/world/CameraDirector';
import {CharacterDirector} from '/src/features/world/CharacterDirector';
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});
renderer.info.autoReset=false;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.setSize(innerWidth,innerHeight,false);
const scene=new THREE.Scene();scene.background=new THREE.Color('#0c1017');
scene.add(new THREE.HemisphereLight(0xffffff,0x687c9a,2.1));
const light=new THREE.DirectionalLight(0xfff5e8,3.1);light.position.set(-2,4,3);light.castShadow=true;light.shadow.mapSize.set(1024,1024);scene.add(light);
for(const [color,intensity,position] of [[0x78e4ff,15,[2,2,-1]],[0xffa4e6,14,[-1,2.1,-1.6]]]){const l=new THREE.PointLight(color,intensity,8);l.position.set(...position);scene.add(l);}
const loader=new GLTFLoader();const gltfs=await Promise.all(['production-room-full','resident-production','fixture-production'].map(name=>loader.loadAsync('/models/'+name+'.glb')));
const integrated=integrateScene(...gltfs);scene.add(integrated.scene);configureProductionLighting(integrated.scene);for(const gltf of gltfs)gltf.scene.animations=gltf.animations;
// WorldInteractionBinding initializes hidden signature to the actual false preference.
integrated.scene.getObjectByName('hidden-yor-mark').visible=false;
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.05,30);const cameras=new CameraDirector(camera);cameras.resize(innerWidth,innerHeight);
const character=new CharacterDirector(integrated.avatarMixer,integrated.chairMixer,integrated.avatarActions,integrated.chairActions,integrated.bodyTurn,integrated.chairRoot);character.settleToWork();
const quality=new RuntimeMaterialQuality(scene);let batch=null,tier='high';
const ext=renderer.getContext().getExtension('WEBGL_multi_draw');
window.samples=[];let draws=[];const direct=renderer.renderBufferDirect;
renderer.renderBufferDirect=function(camera,scene,geometry,material,object,group){const before=this.info.render.calls;const result=direct.call(this,camera,scene,geometry,material,object,group);const count=this.info.render.calls-before;if(count)draws.push({pass:material.isMeshDepthMaterial||material.isMeshDistanceMaterial?'shadow':this.getRenderTarget()?'transmission':'main',material:material.name||material.type,object:object.name,calls:count});return result;};
window.setTier=(next,batched=true,supported=!!ext)=>{batch?.dispose();batch=null;quality.apply(next);tier=next;renderer.shadowMap.enabled=next!=='low';renderer.shadowMap.type=next==='high'?THREE.PCFSoftShadowMap:THREE.PCFShadowMap;renderer.setPixelRatio(next==='high'?1.5:next==='medium'?1.25:1);if(batched)batch=new RigidWorldBatch(scene,supported,camera);window.samples=[];};
window.inspect=()=>{const materials=new Map();let meshes=0,batches=0,casters=0;scene.traverse(object=>{if(object.isMesh){meshes++;if(object.isBatchedMesh)batches++;if(object.castShadow)casters++;for(const m of Array.isArray(object.material)?object.material:[object.material]){let entry=materials.get(m.uuid);if(!entry)materials.set(m.uuid,entry={name:m.name,type:m.type,transmission:m.transmission||0,meshes:0});entry.meshes++;}}});return{meshes,batches,casters,materials:[...materials.values()],multiDraw:!!ext,renderer:renderer.getContext().getParameter(renderer.getContext().getExtension('WEBGL_debug_renderer_info').UNMASKED_RENDERER_WEBGL)};};
window.scene=scene;window.camera=camera;window.character=character;window.cameras=cameras;window.batch=()=>batch;
let last=performance.now();function frame(now){character.advance(Math.min((now-last)/1000,0.1));last=now;batch?.update();renderer.info.reset();draws=[];renderer.render(scene,camera);window.samples.push({tier,calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,draws});if(window.samples.length>120)window.samples.shift();requestAnimationFrame(frame);}requestAnimationFrame(frame);window.ready=true;
</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YOR WORLD - Workstation Sample Three.js Browser Parity Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0b0c10; font-family: sans-serif; }
    #canvas-container { width: 100%; height: 100%; position: relative; }
    canvas { width: 100%; height: 100%; display: block; }
    #status {
      position: absolute; top: 12px; left: 12px; background: rgba(15, 23, 42, 0.85);
      color: #38bdf8; padding: 8px 14px; border-radius: 6px; font-size: 13px;
      border: 1px solid rgba(56, 189, 248, 0.3); pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "./libs/three.module.js",
      "three/examples/jsm/loaders/GLTFLoader.js": "./libs/GLTFLoader.js"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-container">
    <div id="status">Loading Workstation GLTF...</div>
    <canvas id="webgl-canvas"></canvas>
  </div>
  <script type="module" src="./viewer.js"></script>
</body>
</html>

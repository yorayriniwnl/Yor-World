name: CI / Release Quality Gate

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify & Validate Release Candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js runtime (Node 24.19.x)
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Setup pnpm package manager (v9.15.9)
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('deliveries/C3/source/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 1. Frozen dependency install
        working-directory: deliveries/C3/source
        run: pnpm install --frozen-lockfile

      - name: 2. ESLint code standard verification
        working-directory: deliveries/C3/source
        run: pnpm lint

      - name: 3. TypeScript strict typecheck
        working-directory: deliveries/C3/source
        run: pnpm typecheck

      - name: 4. Vitest unit tests
        working-directory: deliveries/C3/source
        run: pnpm test:unit

      - name: 5. Vitest integration & policy tests
        working-directory: deliveries/C3/source
        run: pnpm test:integration

      - name: 6. 3D GLTF/GLB Asset validation (Khronos glTF-Validator)
        run: node scripts/release/validate-gltf-assets.mjs

      - name: 7. Next.js production build
        working-directory: deliveries/C3/source
        run: pnpm build

      - name: Install Playwright browsers
        working-directory: deliveries/C3/source
        run: pnpm exec playwright install --with-deps chromium

      - name: 8. Playwright E2E & interaction navigation tests
        working-directory: deliveries/C3/source
        run: pnpm exec playwright test tests/e2e/room-project-navigation.spec.ts

      - name: 9. WCAG 2.2 AA Accessibility automated audit
        working-directory: deliveries/C3/source
        run: pnpm exec playwright test tests/e2e/accessibility.spec.ts

      - name: 10. Performance budget regression inspection
        run: node scripts/release/check-performance-budgets.mjs

      - name: 11. Canonical Release Manifest Validation
        run: node scripts/release/validate-release.mjs --manifest deliveries/C4/release-manifest.json --strict
